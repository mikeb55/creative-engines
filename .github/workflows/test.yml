name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  composer-os-v2-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run composer-os-v2 test suite
        working-directory: engines/composer-os-v2
        run: node --max-old-space-size=6144 ../../node_modules/ts-node/dist/bin.js --project ../../tsconfig.json tests/runAllTests.ts
