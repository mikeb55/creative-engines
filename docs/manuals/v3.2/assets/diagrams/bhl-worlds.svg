<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250"><rect width="680" height="250" fill="#fff"/><rect x="8" y="8" width="214" height="112" fill="#F3F6F9" stroke="#CFCFCF"/><text x="18" y="30" font-family="Arial" font-size="16" font-weight="700" fill="#D55E00">A</text><text x="36" y="30" font-family="Arial" font-size="12" font-weight="700" fill="#1A1A1A">Triad pairs</text><text x="18" y="54" font-family="Arial" font-size="10" fill="#1A1A1A">Common: Chord tone of one major triad</text><text x="18" y="76" font-family="Arial" font-size="10" fill="#1A1A1A">Contrast:</text><text x="18" y="92" font-family="Arial" font-size="10" fill="#333">Other major triad, up a tone. No shared pi</text><text x="18" y="106" font-family="Arial" font-size="10" fill="#333">tch class.</text><rect x="232" y="8" width="214" height="112" fill="#F3F6F9" stroke="#CFCFCF"/><text x="242" y="30" font-family="Arial" font-size="16" font-weight="700" fill="#D55E00">B</text><text x="260" y="30" font-family="Arial" font-size="12" font-weight="700" fill="#1A1A1A">Harmonic quadratonics</text><text x="242" y="54" font-family="Arial" font-size="10" fill="#1A1A1A">Common: Three chord tones</text><text x="242" y="76" font-family="Arial" font-size="10" fill="#1A1A1A">Contrast:</text><text x="242" y="92" font-family="Arial" font-size="10" fill="#333">Primary tension, from liquid harmony.</text><rect x="456" y="8" width="214" height="112" fill="#F3F6F9" stroke="#CFCFCF"/><text x="466" y="30" font-family="Arial" font-size="16" font-weight="700" fill="#D55E00">C</text><text x="484" y="30" font-family="Arial" font-size="12" font-weight="700" fill="#1A1A1A">Major + augmented</text><text x="466" y="54" font-family="Arial" font-size="10" fill="#1A1A1A">Common: Major third</text><text x="466" y="76" font-family="Arial" font-size="10" fill="#1A1A1A">Contrast:</text><text x="466" y="92" font-family="Arial" font-size="10" fill="#333">Raised fifth, and an augmented triad a maj</text><text x="466" y="106" font-family="Arial" font-size="10" fill="#333">or third away.</text><rect x="8" y="128" width="214" height="112" fill="#F3F6F9" stroke="#CFCFCF"/><text x="18" y="150" font-family="Arial" font-size="16" font-weight="700" fill="#D55E00">D</text><text x="36" y="150" font-family="Arial" font-size="12" font-weight="700" fill="#1A1A1A">Major + diminished</text><text x="18" y="174" font-family="Arial" font-size="10" fill="#1A1A1A">Common: Root</text><text x="18" y="196" font-family="Arial" font-size="10" fill="#1A1A1A">Contrast:</text><text x="18" y="212" font-family="Arial" font-size="10" fill="#333">Minor third and the tritone.</text><rect x="232" y="128" width="214" height="112" fill="#F3F6F9" stroke="#CFCFCF"/><text x="242" y="150" font-family="Arial" font-size="16" font-weight="700" fill="#D55E00">E</text><text x="260" y="150" font-family="Arial" font-size="12" font-weight="700" fill="#1A1A1A">Pentatonic harmony</text><text x="242" y="174" font-family="Arial" font-size="10" fill="#1A1A1A">Common: Tones inside the collection</text><text x="242" y="196" font-family="Arial" font-size="10" fill="#1A1A1A">Contrast:</text><text x="242" y="212" font-family="Arial" font-size="10" fill="#333">A contrasting collection, or one outside t</text><text x="242" y="226" font-family="Arial" font-size="10" fill="#333">one.</text><rect x="456" y="128" width="214" height="112" fill="#F3F6F9" stroke="#CFCFCF"/><text x="466" y="150" font-family="Arial" font-size="16" font-weight="700" fill="#D55E00">F</text><text x="484" y="150" font-family="Arial" font-size="12" font-weight="700" fill="#1A1A1A">Unrelated major triads</text><text x="466" y="174" font-family="Arial" font-size="10" fill="#1A1A1A">Common: Shared tone of a minor-third pair</text><text x="466" y="196" font-family="Arial" font-size="10" fill="#1A1A1A">Contrast:</text><text x="466" y="212" font-family="Arial" font-size="10" fill="#333">Tritone triad, which shares none.</text></svg>